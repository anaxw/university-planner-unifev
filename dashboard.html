<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Rotina Faculdade</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<style>
/* =========================================================
   ESTILOS ESPECÍFICOS DO DASHBOARD
   ========================================================= */

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}

/* Mini calendário */
.calendar-mini {
  padding: 4px 0;
}

.calendar-mini .calendar-grid {
  gap: 2px;
}

.calendar-mini .calendar-day {
  min-height: 32px;
  padding: 2px;
  border-radius: 4px;
  background: transparent;
  aspect-ratio: auto;
}

.calendar-mini .calendar-day:hover {
  background: var(--gray-light);
}

.calendar-mini .calendar-day.today {
  background: var(--primary);
  color: white;
}

.calendar-mini .calendar-day.today .calendar-day__num {
  color: white;
}

.calendar-mini .calendar-day__num {
  font-size: 11px;
  font-weight: 500;
}

.calendar-mini .calendar-day__dots {
  margin-top: 1px;
}

.calendar-mini .calendar-day__dot {
  width: 4px;
  height: 4px;
}

.calendar-mini .calendar-weekday {
  font-size: 10px;
  padding: 4px 0 6px 0;
}

/* Matéria card */
.materia-card {
  display: block;
  padding: 14px 16px;
  background: var(--bg);
  border-radius: var(--radius);
  border-top: 4px solid var(--primary);
  transition: box-shadow var(--transition), transform var(--transition), background var(--transition);
  text-decoration: none;
  color: var(--text);
  cursor: pointer;
}

.materia-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
  background: var(--card);
}

.materia-card__name {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
}

.materia-card__prof {
  font-size: 12px;
  color: var(--text-muted);
}

.materia-card__horario {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.materia-card__horario svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

/* Item list */
.item-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 300px;
  overflow-y: auto;
  padding-right: 4px;
}

.item-list::-webkit-scrollbar {
  width: 4px;
}

.item-list::-webkit-scrollbar-track {
  background: var(--gray-light);
  border-radius: 2px;
}

.item-list::-webkit-scrollbar-thumb {
  background: var(--primary);
  border-radius: 2px;
}

.item-row {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: var(--radius);
  transition: background var(--transition);
  cursor: default;
}

.item-row:hover {
  background: var(--gray-light);
}

.item-row__color {
  width: 4px;
  min-height: 32px;
  border-radius: 2px;
  flex-shrink: 0;
}

.item-row__main {
  flex: 1;
  min-width: 0;
}

.item-row__title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}

.item-row__title svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  color: var(--text-muted);
}

.item-row__meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.item-row__meta svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}

.badge-alta {
  background: #fee2e2;
  color: #dc2626;
}

.badge-media {
  background: #fef3c7;
  color: #d97706;
}

.badge-baixa {
  background: #d1fae5;
  color: #059669;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 24px 16px;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.empty-state svg {
  color: var(--gray-light);
}

.empty-state p {
  margin: 0;
  font-size: 14px;
}

.mt-8 {
  margin-top: 8px;
}

/* Card link */
.card-link {
  font-size: 13px;
  color: var(--primary);
  text-decoration: none;
  transition: color var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.card-link:hover {
  color: var(--primary-dark);
  text-decoration: underline;
}

.card-link svg {
  width: 14px;
  height: 14px;
}

/* Topbar saudação */
#saudacao {
  display: flex;
  align-items: center;
  gap: 8px;
}

#saudacao svg {
  width: 20px;
  height: 20px;
  color: var(--primary);
}

/* Card header com ícone */
.card-header h3 {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
  margin: 0;
}

.card-header h3 svg {
  width: 18px;
  height: 18px;
  color: var(--primary);
}

/* Loading spinner no dashboard */
.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--gray-light);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 20px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Responsividade */
@media (max-width: 1024px) {
  .grid-2 {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 768px) {
  .grid-3 {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  
  .item-row {
    padding: 8px 10px;
  }
  
  .item-row__title {
    font-size: 13px;
  }
  
  .card-header h3 {
    font-size: 14px;
  }
}

@media (max-width: 480px) {
  .grid-3 {
    grid-template-columns: 1fr;
  }
  
  .calendar-mini .calendar-day {
    min-height: 28px;
  }
  
  .calendar-mini .calendar-day__num {
    font-size: 10px;
  }
  
  .calendar-mini .calendar-weekday {
    font-size: 9px;
    padding: 2px 0 4px 0;
  }
  
  .topbar__title {
    font-size: 18px;
  }
  
  .topbar__subtitle {
    font-size: 12px;
  }
}
</style>
</head>
<body>

  <div class="app">
    <div id="sidebar-root"></div>

    <main class="main">
      <div class="topbar">
        <div class="flex items-center gap-12">
          <button class="btn-icon" id="mobile-toggle" aria-label="Abrir menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div>
            <div class="topbar__title" id="saudacao">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              Olá!
            </div>
            <div class="topbar__subtitle" id="data-hoje"></div>
          </div>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom:20px;">
        <!-- Próximas tarefas -->
        <div class="card">
          <div class="card-header">
            <h3>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              Próximas tarefas
            </h3>
            <a class="card-link" href="tarefas.html">
              Ver todas
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </div>
          <div class="item-list" id="lista-proximas-tarefas">
            <div class="loading-spinner"></div>
          </div>
        </div>

        <!-- Próximas provas -->
        <div class="card">
          <div class="card-header">
            <h3>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <polyline points="9 12 11 14 15 10"/>
              </svg>
              Próximas provas
            </h3>
            <a class="card-link" href="tarefas.html">
              Ver todas
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </div>
          <div class="item-list" id="lista-proximas-provas">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom:20px;">
        <!-- Calendário do mês -->
        <div class="card">
          <div class="card-header">
            <h3>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              Calendário do mês
            </h3>
            <a class="card-link" href="calendario.html">
              Abrir
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </div>
          <div id="mini-calendario" class="calendar calendar-mini"></div>
        </div>

        <!-- Últimas anotações -->
        <div class="card">
          <div class="card-header">
            <h3>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              Últimas anotações
            </h3>
            <a class="card-link" href="anotacoes.html">
              Ver todas
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </a>
          </div>
          <div class="item-list" id="lista-ultimas-anotacoes">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>

      <!-- Matérias -->
      <div class="card">
        <div class="grid-3" id="lista-materias-dashboard">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
