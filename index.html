<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Rotina Faculdade</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .auth-page {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    background: linear-gradient(160deg, #050b1f 0%, #0a1533 25%, #0e1f4a 50%, #122a63 75%, #0a1533 100%);
    background-size: 200% 200%;
    animation: authGradientShift 18s ease-in-out infinite;
  }

  @keyframes authGradientShift {
    0%   { background-position: 0% 0%; }
    50%  { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
  }

  .sparkle-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .sparkle {
    position: absolute;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
    opacity: 0;
    animation-name: sparkleTwinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  @keyframes sparkleTwinkle {
    0%, 100% { opacity: 0; transform: scale(0.4); }
    50%      { opacity: 1; transform: scale(1); }
  }

  .auth-card {
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body data-page="login">

  <div class="auth-page">
    <div class="sparkle-layer" id="sparkleLayer"></div>
    <div class="auth-card">
      <div class="auth-brand">
        <img src="img/logo_completo.png" alt="Rotina Faculdade" class="auth-logo">
      </div>

      <!-- PAINEL: LOGIN -->
      <div id="painel-login">
        <div class="auth-title">Bem-vindo de volta</div>
        <div class="auth-subtitle">Entre para organizar sua rotina da faculdade</div>

        <form id="form-login">
          <div class="field">
            <label for="login-email">E-mail</label>
            <input class="input" type="email" id="login-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="login-senha">Senha</label>
            <input class="input" type="password" id="login-senha" required autocomplete="current-password">
          </div>
          <div class="auth-forgot">
            <button type="button" id="link-esqueci-senha">Esqueci minha senha</button>
          </div>
          <button type="submit" class="btn btn-primary w-full">Entrar</button>
        </form>

        <div class="auth-switch">
          Não tem uma conta? <a href="#" id="link-cadastro">Cadastre-se</a>
        </div>
      </div>

      <!-- PAINEL: CADASTRO -->
      <div id="painel-cadastro" class="hidden">
        <div class="auth-title">Criar conta</div>
        <div class="auth-subtitle">Leva menos de um minuto</div>

        <form id="form-cadastro">
          <div class="field">
            <label for="cadastro-nome">Nome</label>
            <input class="input" type="text" id="cadastro-nome" required autocomplete="name">
          </div>
          <div class="field">
            <label for="cadastro-email">E-mail</label>
            <input class="input" type="email" id="cadastro-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="cadastro-senha">Senha</label>
            <input class="input" type="password" id="cadastro-senha" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary w-full">Criar conta</button>
        </form>

        <div class="auth-switch">
          Já tem conta? <a href="#" id="link-voltar-login">Entrar</a>
        </div>
      </div>

      <!-- PAINEL: RECUPERAR SENHA -->
      <div id="painel-recuperar" class="hidden">
        <div class="auth-title">Recuperar senha</div>
        <div class="auth-subtitle">Enviaremos um link para redefinir sua senha</div>

        <form id="form-recuperar">
          <div class="field">
            <label for="recuperar-email">E-mail</label>
            <input class="input" type="email" id="recuperar-email" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary w-full">Enviar link de recuperação</button>
        </form>

        <div class="auth-switch">
          <a href="#" id="link-voltar-login-2">Voltar para o login</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      var layer = document.getElementById('sparkleLayer');
      if (!layer) return;
      var count = 60;
      for (var i = 0; i < count; i++) {
        var s = document.createElement('div');
        s.className = 'sparkle';
        var size = (Math.random() * 2.5 + 1).toFixed(2);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.top = (Math.random() * 100).toFixed(2) + '%';
        s.style.left = (Math.random() * 100).toFixed(2) + '%';
        s.style.animationDuration = (Math.random() * 3 + 2).toFixed(2) + 's';
        s.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
        layer.appendChild(s);
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favicon.js"></script>
</body>
</html>
