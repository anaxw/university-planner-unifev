<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anotações — Rotina Faculdade</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/anotacoes.css">
</head>
<body>

  <div class="app">
    <div id="sidebar-root"></div>

    <main class="main">
      <div class="topbar">
        <div class="flex items-center gap-12">
          <button class="btn-icon" id="mobile-toggle"></button>
          <div>
            <div class="topbar__title">Anotações</div>
            <div class="topbar__subtitle">Suas anotações de aula, organizadas por matéria</div>
          </div>
        </div>
        <div class="topbar__actions">
          <button class="btn btn-primary" id="btn-nova-anotacao">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Nova anotação
          </button>
        </div>
      </div>

      <div class="notes-toolbar-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input class="input" id="busca-anotacao" placeholder="Pesquisar por título...">
        </div>
        <select class="select notes-materia-filter" id="filtro-materia-nota">
          <option value="">Todas as matérias</option>
        </select>
      </div>

      <div class="notes-layout" id="notes-layout">
        <!-- Coluna esquerda: lista de anotações -->
        <div class="notes-list" id="lista-anotacoes">
          <div class="loading-spinner"></div>
        </div>

        <!-- Coluna direita: painel de visualização/edição -->
        <div class="notes-detail" id="notes-detail">
          <div class="notes-detail__empty" id="notes-detail-empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <p>Selecione uma anotação na lista ao lado ou crie uma nova para começar a escrever.</p>
          </div>

          <div class="notes-detail__editor" id="notes-detail-editor" style="display:none;">
            <div class="notes-detail__header">
              <button type="button" class="notes-detail__back" id="btn-voltar-nota" aria-label="Voltar para a lista">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"/>
                </svg>
              </button>
              <input type="text" id="detail-titulo" class="notes-detail__title-input" placeholder="Título da anotação">
              <button type="button" class="notes-detail__fav" id="btn-favoritar" title="Favoritar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
              </button>
            </div>

            <div class="notes-detail__meta">
              <select class="select" id="detail-materia">
                <option value="">Sem matéria</option>
              </select>
              <input type="date" class="input" id="detail-data">
            </div>

            <div class="notes-toolbar" id="notes-toolbar">
              <button type="button" data-md="bold" title="Negrito"><b>B</b></button>
              <button type="button" data-md="italic" title="Itálico"><i>I</i></button>
              <button type="button" data-md="underline" title="Sublinhado"><u>U</u></button>
              <span class="notes-toolbar__divider"></span>
              <button type="button" data-md="h1" title="Título">H1</button>
              <button type="button" data-md="h2" title="Subtítulo">H2</button>
              <span class="notes-toolbar__divider"></span>
              <button type="button" data-md="ul" title="Lista não ordenada">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="8" y1="6" x2="21" y2="6"/>
                  <line x1="8" y1="12" x2="21" y2="12"/>
                  <line x1="8" y1="18" x2="21" y2="18"/>
                  <line x1="3" y1="6" x2="3.01" y2="6"/>
                  <line x1="3" y1="12" x2="3.01" y2="12"/>
                  <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
              </button>
              <button type="button" data-md="ol" title="Lista numerada">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="10" y1="6" x2="21" y2="6"/>
                  <line x1="10" y1="12" x2="21" y2="12"/>
                  <line x1="10" y1="18" x2="21" y2="18"/>
                  <line x1="3" y1="6" x2="3.01" y2="6"/>
                  <line x1="3" y1="12" x2="3.01" y2="12"/>
                  <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
              </button>
              <button type="button" data-md="quote" title="Citação">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/>
                  <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/>
                </svg>
              </button>
              <button type="button" data-md="code" title="Código">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="16 18 22 12 16 6"/>
                  <polyline points="8 6 2 12 8 18"/>
                </svg>
              </button>
            </div>

            <textarea class="notes-detail__content" id="detail-conteudo" placeholder="Escreva sua anotação aqui..."></textarea>

            <div class="notes-detail__footer">
              <span class="notes-detail__status" id="notes-status">Salvo automaticamente</span>
              <div class="notes-detail__actions">
                <button type="button" class="btn btn-danger" id="btn-excluir-nota" style="display:none;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                  </svg>
                  Excluir
                </button>
                <button type="button" class="btn btn-primary" id="btn-salvar-nota" disabled>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                  </svg>
                  Salvar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/anotacoes.js"></script>
  <script src="js/favicon.js"></script>
</body>
</html>
