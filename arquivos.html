<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquivos — Rotina Faculdade</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<style>
/* Estilos específicos da página de arquivos */
.arquivos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.arquivo-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  cursor: pointer;
  transition: box-shadow var(--transition), transform var(--transition);
  border-left: 4px solid var(--primary);
  position: relative;
}

.arquivo-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.arquivo-card__header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.arquivo-card__title {
  font-weight: 700;
  font-size: 14px;
  margin: 0;
  word-break: break-word;
  flex: 1;
  margin-right: 8px;
}

.arquivo-card__tipo {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--gray-light);
  color: var(--text-muted);
  flex-shrink: 0;
}

.arquivo-card__tipo.pdf { background: #fee2e2; color: #dc2626; }
.arquivo-card__tipo.doc { background: #dbeafe; color: #2563eb; }
.arquivo-card__tipo.xls { background: #d1fae5; color: #059669; }
.arquivo-card__tipo.ppt { background: #fef3c7; color: #d97706; }
.arquivo-card__tipo.img { background: #fce7f3; color: #db2777; }
.arquivo-card__tipo.zip { background: #e5e7eb; color: #4b5563; }
.arquivo-card__tipo.txt { background: #e0e7ff; color: #4338ca; }
.arquivo-card__tipo.video { background: #ede9fe; color: #7c3aed; }
.arquivo-card__tipo.audio { background: #fce7f3; color: #be185d; }
.arquivo-card__tipo.outro { background: #f3f4f6; color: #6b7280; }

.arquivo-card__descricao {
  font-size: 13px;
  color: var(--text-muted);
  margin: 8px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.arquivo-card__materia {
  font-size: 12px;
  color: var(--primary);
  background: rgba(79, 125, 243, 0.08);
  padding: 2px 10px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
}

.arquivo-card__footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--gray-light);
  font-size: 12px;
  color: var(--text-muted);
}

.arquivo-card__actions {
  display: flex;
  gap: 6px;
}

.arquivo-card__actions button {
  background: none;
  border: none;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: background var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.arquivo-card__actions .btn-download:hover {
  background: rgba(79, 125, 243, 0.1);
}

.arquivo-card__actions .btn-delete:hover {
  background: rgba(239, 68, 68, 0.1);
}

.arquivo-card__actions svg {
  width: 18px;
  height: 18px;
}

/* Filtros */
.filtros-bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  background: var(--card);
  padding: 16px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.filtros-bar .input,
.filtros-bar .select {
  flex: 1;
  min-width: 150px;
}

.filtros-bar .input {
  flex: 2;
  min-width: 200px;
}

/* Empty state */
.empty-state-arquivos {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state-arquivos .empty-icon {
  margin-bottom: 16px;
  display: flex;
  justify-content: center;
}

.empty-state-arquivos h3 {
  font-size: 18px;
  color: var(--text);
  margin-bottom: 8px;
}

/* Modal de detalhes */
.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}

.detail-title {
  font-size: 18px;
  font-weight: 700;
  margin: 0;
}

.detail-info {
  margin: 16px 0;
}

.detail-info p {
  margin: 8px 0;
  color: var(--text-muted);
}

.detail-info strong {
  color: var(--text);
}

.detail-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--gray-light);
}

.detail-actions .btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Upload form */
#upload-form .field:last-child {
  margin-bottom: 0;
}

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--gray-light);
  color: var(--text-muted);
}

/* Search icon */
.search-box {
  position: relative;
  flex: 2;
  min-width: 200px;
}

.search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text-muted);
  pointer-events: none;
}

.search-box .input {
  padding-left: 38px;
  width: 100%;
}

/* Responsividade */
@media (max-width: 768px) {
  .filtros-bar {
    flex-direction: column;
  }
  
  .filtros-bar .input,
  .filtros-bar .select,
  .search-box {
    min-width: unset;
    width: 100%;
  }
  
  .arquivos-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="app">
  <div id="sidebar-root"></div>

  <main class="main">
    <div class="topbar">
      <div class="flex items-center gap-12">
        <button class="btn-icon" id="mobile-toggle"></button>
        <div>
          <div class="topbar__title">Arquivos</div>
          <div class="topbar__subtitle">Gerencie seus arquivos e materiais</div>
        </div>
      </div>
      <div class="topbar__actions">
        <button class="btn btn-primary" id="btn-upload">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Novo arquivo
        </button>
      </div>
    </div>

    <!-- Filtros -->
    <div class="filtros-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="input" id="search-input" placeholder="Buscar arquivos...">
      </div>
      <select class="select" id="filter-materia">
        <option value="">Todas as matérias</option>
      </select>
      <select class="select" id="filter-tipo">
        <option value="">Todos os tipos</option>
        <option value="pdf">PDF</option>
        <option value="doc">Documento</option>
        <option value="xls">Planilha</option>
        <option value="ppt">Apresentação</option>
        <option value="img">Imagem</option>
        <option value="zip">Arquivo ZIP</option>
        <option value="txt">Texto</option>
        <option value="video">Vídeo</option>
        <option value="audio">Áudio</option>
        <option value="outro">Outro</option>
      </select>
    </div>

    <!-- Lista de arquivos -->
    <div class="arquivos-grid" id="lista-arquivos">
      <div class="loading-spinner" style="grid-column:1/-1;margin:40px auto;"></div>
    </div>
  </main>
</div>

<!-- MODAL: Upload -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Enviar arquivo</h3>
      <button class="modal-close" onclick="fecharModal('upload-modal')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <form id="upload-form">
      <div class="field">
        <label for="file-input">Arquivo *</label>
        <input type="file" class="input" id="file-input" required>
      </div>
      <div class="field">
        <label for="file-title">Título *</label>
        <input type="text" class="input" id="file-title" placeholder="Ex: Resumo da Aula 1" required>
      </div>
      <div class="field">
        <label for="file-description">Descrição</label>
        <textarea class="textarea" id="file-description" rows="3" placeholder="Descreva o conteúdo do arquivo..."></textarea>
      </div>
      <div class="field">
        <label for="file-materia">Matéria</label>
        <select class="select" id="file-materia">
          <option value="">Selecione uma matéria</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="fecharModal('upload-modal')">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="submit-upload">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Enviar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: Detalhes -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Detalhes do arquivo</h3>
      <button class="modal-close" onclick="fecharModal('detail-modal')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div id="detail-content">
      <!-- Renderizado via JS -->
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/arquivos.js"></script>
</body>
</html>
